<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Mikaela VPN</title>
<style>
:root,[data-theme=dark]{--bg:#0b0f1a;--card:#141a2b;--tx:#e8ecf8;--mut:#8b94b0;--ac:#7c5cff;--ok:#29d391;--err:#ff6b6b;--in:#0e1424;--bd:#232b45;--bt:#1b2340;--onbg:#12382c}
[data-theme=gray]{--bg:#23262d;--card:#2f333c;--tx:#eceef3;--mut:#9aa1b2;--ac:#8a6dff;--in:#262a31;--bd:#454b59;--bt:#3b404b;--onbg:#27443c}
[data-theme=light]{--bg:#eef0f6;--card:#fff;--tx:#151a2c;--mut:#6b7391;--ac:#6b4cf0;--err:#e5484d;--ok:#12a36b;--in:#f3f5fa;--bd:#d9deea;--bt:#e6e9f3;--onbg:#d9f6ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px 'Segoe UI',sans-serif;height:100vh;overflow-y:auto;padding:0 18px 90px}
h1{font-size:22px;margin:16px 0 4px}h2{font-size:18px;margin:0 0 6px}.mut{color:var(--mut)}.hide{display:none!important}.e{color:var(--err)}.g{color:var(--ok)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}
input,select{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font-size:14px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:var(--ac);color:#fff;font-size:14px;font-weight:600;width:100%;margin-top:12px}
button.ghost{background:transparent;border:1px solid var(--bd);color:var(--mut)}button.tg{background:#229ed9}
a{color:var(--ac);cursor:pointer;font-size:13px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:14px;width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--mut);font-size:12px}.pw input{padding-right:70px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{margin:0;background:var(--bt);color:var(--tx);flex:1;min-width:90px}.seg button.act{background:var(--ac);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.row:first-child{margin-top:0}
.sep{text-align:center;color:var(--mut);margin:14px 0 2px;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px}
.pill{width:auto;margin:0;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.pill i{font-style:normal;background:var(--ac);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:14px}
#big{width:164px;height:164px;border-radius:50%;margin:22px auto 10px;display:flex;align-items:center;justify-content:center;background:var(--bt);color:var(--mut);border:3px solid var(--bd);transition:.25s}
#big svg{width:58px;height:58px}#big.on{background:var(--onbg);border-color:var(--ok);color:var(--ok);box-shadow:0 0 40px #29d39144}
.bar{height:6px;background:var(--in);border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.fl{object-fit:cover;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.srv{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--bd)}.srv:last-child{border:0}
.srv.sel{background:var(--bt);border-radius:10px}.srv.clk{cursor:pointer}
.srv .n{font-weight:600}.srv .s{font-size:11px;color:var(--mut)}.srv .p{margin-left:auto;font-size:12px;color:var(--mut)}
.tag{font-size:10px;background:var(--ac);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:600}
button.del{width:auto;margin:0 0 0 auto;padding:6px 10px;background:transparent;border:1px solid var(--err);color:var(--err);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{margin:0;border-radius:0;background:transparent;color:var(--mut);padding:10px 0 8px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.act{color:var(--ac)}nav svg{width:22px;height:22px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
</style></head><body>

<div id="login">
  <h1>Mikaela VPN</h1><div class="mut">Аккаунт общий с ботом и кабинетом</div>
  <div class="card">
    <div class="seg"><button id="tL" class="act">Вход</button><button id="tR">Регистрация</button></div>
    <input id="nm" class="hide" placeholder="Имя (необязательно)">
    <input id="em" type="email" placeholder="Email">
    <div class="pw"><input id="pw" type="password" placeholder="Пароль"><button id="eye" type="button">Показать</button></div>
    <button id="go">Войти</button>
    <div style="text-align:right;margin-top:10px" id="fgW"><a id="fg">Забыли пароль / не задан пароль?</a></div>
    <div id="msg" style="margin-top:10px;min-height:18px;font-size:13px"></div>
    <div class="sep">или</div>
    <button class="tg" id="tg">Войти через Telegram</button>
    <button class="ghost" id="web">Войти через Google</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="top"><div><b style="font-size:17px">Mikaela VPN</b><div class="mut" id="who" style="font-size:12px"></div></div>
    <button class="pill" id="balBtn"><span id="bal">—</span><i>+</i></button></div>

  <section id="pHome">
    <button id="big" aria-label="Подключить"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1011.4 0"/></svg></button>
    <div id="st" style="text-align:center;font-weight:600">Отключено</div>
    <div class="card row" id="curSrv" style="cursor:pointer"><span class="mut">Сервер</span><b id="curName">Авто</b></div>
    <div class="card">
      <div class="row"><span class="mut">Тариф</span><b id="tar">—</b></div>
      <div class="row"><span class="mut">Осталось</span><b id="left">—</b></div>
      <div class="row"><span class="mut">Устройства</span><b id="dev">—</b></div>
      <div class="row"><span class="mut">Трафик</span><b id="tr">—</b></div><div class="bar hide" id="trw"><i id="trb" style="width:0"></i></div>
      <button id="renewBtn">Продлить подписку</button>
    </div>
    <div id="err2" class="e" style="font-size:13px;margin-top:10px"></div>
  </section>

  <section id="pSrv" class="hide">
    <h1>Серверы</h1>
    <div class="card"><div class="row"><b>Mikaela VPN</b><span class="mut" id="subHead">—</span></div>
      <div class="mut" style="font-size:11px;margin-top:6px" id="upd">Автообновление: 1 ч</div></div>
    <div class="seg" style="margin-top:12px"><button id="pingAll">Тест пинга</button><button id="reload" class="ghost">Обновить</button></div>
    <div class="card" id="list" style="padding:8px 12px"></div>
    <div id="srvErr" class="e" style="font-size:13px;margin-top:10px"></div>
  </section>

  <section id="pDev" class="hide">
    <h1>Устройства</h1>
    <div class="card"><div class="row"><span class="mut">Подключено</span><b id="devHead">—</b></div></div>
    <div class="card" id="devList" style="padding:8px 12px"></div>
    <button class="ghost" id="devReset">Сбросить все устройства</button>
    <div id="devErr" class="e" style="font-size:13px;margin-top:10px"></div>
  </section>

  <section id="pSet" class="hide">
    <h1>Настройки</h1>
    <div class="card"><div class="mut">Тема</div>
      <div class="seg" id="themes" style="margin-top:10px"><button data-t="auto">Как в системе</button><button data-t="light">Белая</button><button data-t="gray">Серая</button><button data-t="dark">Чёрная</button></div></div>
    <div class="card"><div class="mut" id="acc"></div><button class="ghost" id="out">Выйти из аккаунта</button></div>
  </section>

  <nav>
    <button data-p="pHome" class="act"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Главная</button>
    <button data-p="pSrv"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>Серверы</button>
    <button data-p="pDev"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Устройства</button>
    <button data-p="pSet"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Настройки</button>
  </nav>
  <div id="sheet" class="hide"><div class="sheet"><div id="sheetBody"></div><button class="ghost" id="sheetClose">Закрыть</button></div></div>
</div>

<script src="flags.js"></script>
<script>
const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{return localStorage.getItem(k)||d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const S={theme:ls.get('theme','auto'),server:ls.get('server',''),list:[],ping:{},sub:null,dev:null,user:null};
let on=false,busy=false,reg=false,tgWait=false,watch=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=k=>(k/100).toFixed(2)+' ₽';

/* ---------- тема ---------- */
const mq=matchMedia('(prefers-color-scheme: light)');
function applyTheme(t){S.theme=t;ls.set('theme',t);document.documentElement.dataset.theme=t==='auto'?(mq.matches?'light':'dark'):t;
  document.querySelectorAll('#themes button').forEach(b=>b.classList.toggle('act',b.dataset.t===t))}
mq.onchange=()=>{if(S.theme==='auto')applyTheme('auto')};
document.querySelectorAll('#themes button').forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
applyTheme(S.theme);

/* ---------- вход ---------- */
const view=v=>{$('login').classList.toggle('hide',v!=='login');$('app').classList.toggle('hide',v!=='app')};
const say=(t,ok)=>{$('msg').className=ok?'g':'e';$('msg').textContent=t||''};
function tab(r){reg=r;$('tL').classList.toggle('act',!r);$('tR').classList.toggle('act',r);$('nm').classList.toggle('hide',!r);
  $('go').textContent=r?'Зарегистрироваться':'Войти';$('fgW').classList.toggle('hide',r);$('pw').placeholder=r?'Пароль (минимум 8 символов)':'Пароль';say('')}
$('tL').onclick=()=>tab(false);$('tR').onclick=()=>tab(true);
$('eye').onclick=()=>{const h=$('pw').type==='password';$('pw').type=h?'text':'password';$('eye').textContent=h?'Скрыть':'Показать'};
$('go').onclick=async()=>{
  say('');const e=$('em').value.trim(),p=$('pw').value;
  if(!e||!p)return say('Введите почту и пароль');
  if(reg){if(p.length<8)return say('Пароль минимум 8 символов');
    const r=await vpn.register(e,p,$('nm').value.trim());
    if(r.ok){tab(false);$('em').value=e;say(r.data+' После подтверждения почты нажмите «Войти».',true)}else say(r.error)}
  else{const r=await vpn.login(e,p);r.ok?enter(r.data):say(r.error)}
};
$('pw').onkeydown=e=>e.key==='Enter'&&$('go').click();
$('fg').onclick=async()=>{const e=$('em').value.trim();if(!e)return say('Сначала введите почту');const r=await vpn.forgot(e);r.ok?say(r.data,true):say(r.error)};
$('tg').onclick=async()=>{
  if(tgWait){await vpn.tgCancel();return}
  tgWait=true;$('tg').textContent='Жду подтверждения в Telegram… (отмена)';say('Откроется Telegram — нажмите Start у бота',true);
  const r=await vpn.tg();tgWait=false;$('tg').textContent='Войти через Telegram';r.ok?enter(r.data):say(r.error)};
$('web').onclick=async()=>{say('');const r=await vpn.webLogin();r.ok?enter(r.data):say(r.error)};
$('out').onclick=async()=>{await vpn.logout();S.list=[];S.sub=null;S.dev=null;view('login')};

/* ---------- навигация / окна ---------- */
function go(p){['pHome','pSrv','pDev','pSet'].forEach(x=>$(x).classList.toggle('hide',x!==p));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('act',b.dataset.p===p));
  if(p==='pSrv'&&!S.list.length)loadServers(false);if(p==='pDev')loadDevices()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('curSrv').onclick=()=>go('pSrv');
function sheet(html){$('sheetBody').innerHTML=html;$('sheet').classList.remove('hide')}
function closeSheet(){$('sheet').classList.add('hide');if(watch){clearInterval(watch);watch=null}}
$('sheetClose').onclick=closeSheet;

/* ---------- аккаунт и подписка ---------- */
async function init(){try{const r=await vpn.session();r.data?enter(r.data):view('login')}catch(e){view('login');say('Ошибка запуска: '+e.message)}}
async function enter(u){view('app');go('pHome');setUser(u);
  const m=await vpn.me();if(m.ok&&m.data)setUser(m.data);else if(m.error==='AUTH')return view('login');
  await refreshSub();poll();loadServers(false)}
function setUser(u){if(!u)return;S.user=u;const w=u.email||(u.username?'@'+u.username:'');$('who').textContent=w;$('acc').textContent=w;
  const b=u.balance_kopeks!=null?u.balance_kopeks/100:u.balance_rubles;if(b!=null)$('bal').textContent=Number(b).toFixed(2)+' ₽'}
const daysLeft=s=>{if(s.days_left!=null)return s.days_left;const m=/(\d+)\s*d/i.exec(s.time_left_display||'');return m?+m[1]:null};
async function refreshSub(){
  const r=await vpn.sub();if(!r.ok){if(r.error==='AUTH')return view('login');return $('err2').textContent=r.error}
  S.sub=r.data.subscription||null;
  const d=await vpn.devices();if(d.ok){S.dev=d.data;if(S.dev.limit==null&&S.sub)S.dev.limit=S.sub.device_limit}
  renderInfo();renderDevices();
}
function renderInfo(){const s=S.sub;if(!s){$('tar').textContent='нет подписки';return}
  $('tar').textContent=s.tariff_name||(s.is_trial?'Пробный':'Подписка');
  const dl=daysLeft(s);$('left').textContent=s.is_expired?'истекла':dl!=null?dl+' дн.':(s.time_left_display||'—');
  const lim=S.dev&&S.dev.limit!=null?S.dev.limit:s.device_limit;
  $('dev').textContent=S.dev?`${S.dev.count} / ${lim||'∞'}`:'—';
  const used=(s.traffic_used_gb||0).toFixed(1);
  $('tr').textContent=s.traffic_limit_gb?`${used} / ${s.traffic_limit_gb} ГБ`:`${used} ГБ / безлимит`;
  $('trw').classList.toggle('hide',!s.traffic_limit_gb);$('trb').style.width=Math.min(100,s.traffic_used_percent||0)+'%';
  $('subHead').textContent=`${used} ГБ / ${s.traffic_limit_gb?s.traffic_limit_gb+' ГБ':'∞'}${dl!=null?' · '+dl+' дн.':''}`}

/* ---------- серверы ---------- */
const CC={россия:'RU',финляндия:'FI',германия:'DE',нидерланды:'NL',эстония:'EE',дания:'DK',сша:'US',франция:'FR',польша:'PL',швеция:'SE',латвия:'LV',литва:'LT',казахстан:'KZ',турция:'TR',великобритания:'GB',швейцария:'CH',сингапур:'SG',япония:'JP',австрия:'AT',чехия:'CZ',италия:'IT',испания:'ES',канада:'CA',украина:'UA',беларусь:'BY',армения:'AM',грузия:'GE',израиль:'IL',оаэ:'AE',индия:'IN',сербия:'RS',болгария:'BG',румыния:'RO',венгрия:'HU',норвегия:'NO',португалия:'PT'};
function parse(name){let code='',label=name;const m=name.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
  if(m){code=[...m[0]].map(c=>String.fromCharCode(c.codePointAt(0)-0x1F1E6+65)).join('');label=name.replace(/[\u{1F1E6}-\u{1F1FF}]{2}\s*/gu,'').trim()||name}
  if(!code){const l=label.toLowerCase();for(const k in CC)if(l.includes(k)){code=CC[k];break}}return{code,label}}
function badge(code){const f=window.FLAGS&&code&&window.FLAGS[code.toLowerCase()];if(f)return `<img class="fl" src="${f}" alt="${esc(code)}">`;let h=0;for(const c of code||'AUTO')h=(h*31+c.charCodeAt(0))%360;return `<span class="fl" style="background:hsl(${h} 50% 40%)">${esc(code||'★')}</span>`}
async function loadServers(force){
  $('srvErr').textContent='';if(force)$('list').innerHTML='<div class="mut" style="padding:10px">Загружаю…</div>';
  const r=await vpn.servers({force});
  if(!r.ok){$('list').innerHTML='';return $('srvErr').textContent=r.error}
  S.list=r.data.list;if(!S.list.find(x=>x.tag===S.server)){S.server=S.list[0]?S.list[0].tag:'';ls.set('server',S.server)}
  $('upd').textContent='Автообновление: 1 ч · обновлено '+new Date(r.data.at||Date.now()).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  renderServers();renderCur()}
function renderServers(){
  $('list').innerHTML=S.list.map((s,i)=>{const p=parse(s.tag),pg=S.ping[s.tag];
    const sub=s.auto?'Автовыбор лучшего':[s.proto,s.net,s.sec].filter(Boolean).join(' / ');
    return `<div class="srv clk ${s.tag===S.server?'sel':''}" data-i="${i}">${badge(p.code)}<div><div class="n">${esc(p.label)}</div><div class="s">${esc(sub)}</div></div><div class="p">${pg==null?'':pg<0?'—':pg+' мс'}</div></div>`}).join('')||'<div class="mut" style="padding:10px">Нет серверов</div>';
  document.querySelectorAll('.srv.clk').forEach(el=>el.onclick=()=>pick(S.list[+el.dataset.i].tag))}
function renderCur(){const s=S.list.find(x=>x.tag===S.server);$('curName').textContent=s?parse(s.tag).label:'Авто'}
async function pick(t){S.server=t;ls.set('server',t);renderServers();renderCur();await vpn.pick(t)}
$('pingAll').onclick=()=>S.list.filter(s=>!s.auto).forEach(async s=>{S.ping[s.tag]=undefined;const r=await vpn.ping(s.tag);S.ping[s.tag]=r.ok?r.data:-1;renderServers()});
$('reload').onclick=()=>loadServers(true);

/* ---------- устройства ---------- */
async function loadDevices(){$('devErr').textContent='';const r=await vpn.devices();if(!r.ok)return $('devErr').textContent=r.error;
  S.dev=r.data;if(S.dev.limit==null&&S.sub)S.dev.limit=S.sub.device_limit;renderDevices();renderInfo()}
function renderDevices(){const d=S.dev;if(!d)return;$('devHead').textContent=`${d.count} / ${d.limit||'∞'}`;
  $('devList').innerHTML=d.list.map(x=>`<div class="srv"><svg viewBox="0 0 24 24" width="26" height="26" style="flex:none;color:var(--mut)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><div><div class="n">${esc(x.model||x.platform||'Устройство')}${x.self?'<span class="tag">это устройство</span>':''}</div><div class="s">${esc(x.platform)}${x.platform?' · ':''}${esc(x.hwid.slice(0,10))}…</div></div><button class="del" data-h="${esc(x.hwid)}" data-s="${x.self?1:0}">Удалить</button></div>`).join('')||'<div class="mut" style="padding:10px">Нет подключённых устройств</div>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm(b.dataset.s==='1'?'Это текущее устройство. Удалить его из аккаунта? При следующем обновлении подписки оно привяжется заново.':'Удалить это устройство из бота и панели?'))return;
    const r=await vpn.delDevice(b.dataset.h);if(!r.ok)return $('devErr').textContent=r.error;loadDevices()})}

$('devReset').onclick=async()=>{if(!confirm('Удалить ВСЕ устройства из аккаунта? Текущее устройство привяжется заново при следующем обновлении.'))return;const r=await vpn.resetDevices();if(!r.ok)return $('devErr').textContent=r.error;loadDevices()};

/* ---------- баланс: пополнение ---------- */
$('balBtn').onclick=openTopup;
async function openTopup(){
  sheet('<h2>Пополнение баланса</h2><div class="mut">Загружаю способы оплаты…</div>');
  const r=await vpn.methods();
  if(!r.ok)return sheet(`<h2>Пополнение баланса</h2><div class="e">${esc(r.error)}</div>`);
  const ms=(r.data||[]).filter(m=>m.is_available!==false);
  if(!ms.length)return sheet('<h2>Пополнение баланса</h2><div class="mut">Нет доступных способов оплаты</div>');
  let m=ms[0],opt='';
  const draw=()=>{const min=Math.ceil((m.min_amount_kopeks||1000)/100),os=(m.options||[]).map(o=>({id:o.id||o.code||o.value,name:o.name||o.title||o.label||o.id}));
    if(os.length&&!os.find(o=>o.id===opt))opt=os[0].id;if(!os.length)opt='';
    sheet(`<h2>Пополнение баланса</h2><div class="mut">Сейчас: ${S.user&&S.user.balance_kopeks!=null?rub(S.user.balance_kopeks):'—'}</div>
      <div class="seg" id="ms" style="margin-top:12px">${ms.map((x,i)=>`<button data-i="${i}" class="${x.id===m.id?'act':''}">${esc(x.name)}</button>`).join('')}</div>
      ${os.length?`<select id="op">${os.map(o=>`<option value="${esc(o.id)}" ${o.id===opt?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`:''}
      <input id="amt" type="number" min="${min}" placeholder="Сумма, ₽ (от ${min})" value="${$('amt')?$('amt').value:''}">
      <div class="seg" style="margin-top:10px">${[100,300,500,1000].map(v=>`<button class="ghost" data-v="${v}">${v} ₽</button>`).join('')}</div>
      <button id="pay">Оплатить</button><div id="pm" style="margin-top:10px;font-size:13px"></div>`);
    document.querySelectorAll('#ms button').forEach(b=>b.onclick=()=>{m=ms[+b.dataset.i];draw()});
    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>$('amt').value=b.dataset.v);
    if($('op'))$('op').onchange=()=>opt=$('op').value;
    $('pay').onclick=async()=>{const v=parseFloat(($('amt').value||'').replace(',','.')),pm=(t,ok)=>{$('pm').className=ok?'g':'e';$('pm').textContent=t};
      if(!(v>=min))return pm('Минимальная сумма — '+min+' ₽');
      const x=await vpn.topup({amount_kopeks:Math.round(v*100),payment_method:m.id,payment_option:opt||undefined});
      if(!x.ok)return pm(/Failed to create/i.test(x.error)?x.error+'. Платёжная система не приняла сумму — попробуйте сумму побольше (от 100 ₽) или другой способ оплаты.':x.error);pm('Страница оплаты открыта в браузере. Баланс обновится автоматически.',true);watchBalance()}};
  draw()}
function watchBalance(){const start=S.user&&S.user.balance_kopeks;let n=0;if(watch)clearInterval(watch);
  watch=setInterval(async()=>{const m=await vpn.me();if(m.ok&&m.data){setUser(m.data);if(m.data.balance_kopeks!==start){clearInterval(watch);watch=null;closeSheet();refreshSub()}}if(++n>36){clearInterval(watch);watch=null}},5000)}

/* ---------- продление ---------- */
$('renewBtn').onclick=async()=>{
  sheet('<h2>Продление подписки</h2><div class="mut">Загружаю варианты…</div>');
  const r=await vpn.renewOptions();
  if(!r.ok)return sheet(`<h2>Продление подписки</h2><div class="e">${esc(r.error)}</div>`);
  const d=r.data,a=Array.isArray(d)?d:(d.periods||d.options||d.renewal_options||d.items||[]);
  const list=a.map(x=>({days:x.period_days||x.days||x.period||x.value,price:x.price_kopeks!=null?x.price_kopeks:(x.final_price_kopeks!=null?x.final_price_kopeks:x.total_price_kopeks),label:x.label||x.title||x.name||''})).filter(x=>x.days);
  if(!list.length)return sheet('<h2>Продление подписки</h2><div class="mut">Для вашего тарифа продление недоступно (возможно, подписка бессрочная).</div>');
  sheet(`<h2>Продление подписки</h2><div class="mut">Оплата с баланса: ${S.user&&S.user.balance_kopeks!=null?rub(S.user.balance_kopeks):'—'}</div>
    ${list.map((x,i)=>`<button class="ghost" style="color:var(--tx)" data-i="${i}">${esc(x.label||x.days+' дн.')}${x.price!=null?' — '+rub(x.price):''}</button>`).join('')}<div id="rm" style="margin-top:10px;font-size:13px"></div>`);
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{const x=list[+b.dataset.i],rm=(t,ok)=>{$('rm').className=ok?'g':'e';$('rm').textContent=t};
    if(!confirm(`Продлить на ${x.days} дн.${x.price!=null?' за '+rub(x.price):''}? Деньги спишутся с баланса.`))return;
    const q=await vpn.renew(x.days);if(!q.ok)return rm(q.error+(/средств|balance|insufficient/i.test(q.error)?' — пополните баланс (кнопка вверху).':''));
    rm('Подписка продлена',true);const m=await vpn.me();if(m.ok&&m.data)setUser(m.data);refreshSub()})};

/* ---------- подключение (только TUN) ---------- */
$('big').onclick=async()=>{
  if(busy)return;busy=true;$('err2').textContent='';
  if(on){$('st').textContent='Отключаю…';await vpn.disconnect()}
  else{$('st').textContent='Подключаю…';const r=await vpn.connect({server:S.server});if(!r.ok)$('err2').textContent=r.error}
  busy=false;poll()};
async function poll(){const r=await vpn.status();if(!r.ok)return;on=r.data.running;
  $('big').classList.toggle('on',on);if(!busy)$('st').textContent=on?'Подключено':'Отключено';
  if(on&&r.data.now&&r.data.now!==S.server&&S.list.find(x=>x.tag===r.data.now)){S.server=r.data.now;renderServers();renderCur()}}
const live=()=>!$('app').classList.contains('hide');
setInterval(()=>{if(live())poll()},3000);
setInterval(async()=>{if(!live())return;refreshSub();const m=await vpn.me();if(m.ok&&m.data)setUser(m.data)},60000);
setInterval(()=>{if(live())loadServers(true)},3600000); // автообновление подписки раз в час
init();
</script></body></html>
